<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KSPP - Karnataka State Police Portal</title>
    <meta
      name="description"
      content="Karnataka State Police Portal - Secure Policing, Trusted Governance."
    />
    <meta name="theme-color" content="#0b315f" />
    <link rel="icon" type="image/jpeg" href="/src/KSPP_LOGO.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Fustat:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      #kspp-boot {
        position: fixed;
        z-index: 99999;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 42%, rgba(229, 184, 63, 0.14), transparent 24rem),
          #071f3e;
        color: #fff;
        font-family: Inter, system-ui, sans-serif;
        transition: opacity 420ms ease, visibility 420ms ease;
      }
      #kspp-boot::before {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        height: 5px;
        background: linear-gradient(
          90deg,
          #ff8f1f 0 33.333%,
          #fff 33.333% 66.666%,
          #16834f 66.666%
        );
        content: "";
      }
      #kspp-boot.is-ready {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .kspp-boot-content {
        position: relative;
        display: grid;
        max-width: 28rem;
        place-items: center;
        padding: 2rem;
        text-align: center;
      }
      .kspp-boot-logo-wrap {
        position: relative;
        height: 7.5rem;
        width: 7.5rem;
        padding: 0.35rem;
        border: 1px solid rgba(229, 184, 63, 0.72);
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 18px 55px rgba(0,0,0,.28);
        animation: kspp-boot-pulse 1.7s ease-in-out infinite;
      }
      .kspp-boot-logo-wrap::after {
        position: absolute;
        inset: -0.6rem;
        border: 1px solid rgba(229, 184, 63, 0.35);
        border-radius: inherit;
        content: "";
        animation: kspp-boot-ring 1.7s ease-out infinite;
      }
      .kspp-boot-logo {
        height: 100%;
        width: 100%;
        border-radius: 999px;
        object-fit: cover;
      }
      .kspp-boot-kicker {
        margin-top: 1.7rem;
        color: #e5b83f;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .kspp-boot-title {
        margin-top: 0.55rem;
        font-size: clamp(1.25rem, 4vw, 1.8rem);
        font-weight: 650;
        letter-spacing: -0.025em;
      }
      .kspp-boot-kannada {
        margin-top: 0.4rem;
        color: rgba(255,255,255,.92);
        font-family: "Noto Sans Kannada", Inter, system-ui, sans-serif;
        font-size: clamp(1rem, 3vw, 1.2rem);
        font-weight: 600;
      }
      .kspp-boot-tagline {
        margin-top: 0.55rem;
        color: rgba(255,255,255,.7);
        font-size: 0.8rem;
      }
      .kspp-boot-progress {
        position: relative;
        width: 10rem;
        height: 2px;
        margin-top: 1.6rem;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255,255,255,.14);
      }
      .kspp-boot-progress::after {
        position: absolute;
        inset: 0;
        width: 42%;
        border-radius: inherit;
        background: #e5b83f;
        content: "";
        animation: kspp-boot-progress 1.15s ease-in-out infinite;
      }
      @keyframes kspp-boot-pulse {
        50% { transform: translateY(-3px); }
      }
      @keyframes kspp-boot-ring {
        from { transform: scale(.88); opacity: .8; }
        to { transform: scale(1.18); opacity: 0; }
      }
      @keyframes kspp-boot-progress {
        from { transform: translateX(-120%); }
        to { transform: translateX(340%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .kspp-boot-logo-wrap,
        .kspp-boot-logo-wrap::after,
        .kspp-boot-progress::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="kspp-boot" role="status" aria-live="polite" aria-label="Loading Karnataka State Police Portal">
      <div class="kspp-boot-content">
        <div class="kspp-boot-logo-wrap">
          <img
            class="kspp-boot-logo"
            src="/src/KSPP_LOGO.jpeg"
            alt="KSPP emblem"
          />
        </div>
        <div class="kspp-boot-kicker">ಕರ್ನಾಟಕ ಸರ್ಕಾರ · Government of Karnataka</div>
        <div class="kspp-boot-title">Karnataka State Police Portal</div>
        <div class="kspp-boot-kannada">ಕರ್ನಾಟಕ ರಾಜ್ಯ ಪೊಲೀಸ್ ಪೋರ್ಟಲ್</div>
        <div class="kspp-boot-tagline">Secure Policing • Trusted Governance</div>
        <div class="kspp-boot-progress" aria-hidden="true"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
